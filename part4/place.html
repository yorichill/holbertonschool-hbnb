<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Details — HBnB</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div id="app-header"></div>
  </header>

  <!-- ── Main ── -->
  <main>

    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Places</a>
      <span>›</span>
      <span id="breadcrumb-name">Loading…</span>
    </nav>

    <!-- Place details container -->
    <div id="place-container">
      <!-- Skeleton while loading -->
      <div id="skeleton-place" class="place-details" aria-hidden="true">
        <div class="skeleton" style="height:380px;border-radius:9px 9px 0 0"></div>
        <div class="place-info">
          <div class="skeleton" style="height:32px;width:55%;border-radius:6px;margin-bottom:16px"></div>
          <div class="skeleton" style="height:16px;width:35%;border-radius:4px;margin-bottom:10px"></div>
          <div class="skeleton" style="height:60px;width:80%;border-radius:4px;margin-bottom:20px"></div>
          <div class="skeleton" style="height:36px;width:120px;border-radius:8px"></div>
        </div>
      </div>
    </div>

    <!-- Reviews section -->
    <section class="reviews-section" id="reviews-section" aria-label="Reviews" style="display:none">
      <h2 class="section-title">Reviews</h2>
      <div id="reviews-container" class="reviews-grid"></div>
    </section>

    <!-- Add review (authenticated users only) -->
    <div id="add-review-cta" style="display:none;margin-top:8px"></div>

    <!-- Booking section (all users) -->
    <div id="booking-section" style="display:none;margin-top:32px"></div>

  </main>

  <!-- ── Footer ── -->
  <footer>
    <p>&copy; <span id="year"></span> HBnB — All rights reserved.</p>
  </footer>

  <!-- ── Toast ── -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { getCookie, showToast, escapeHTML, escapeAttr, starsHTML } from './utils.js';
    import { initAuthNav } from './header.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    const token = getCookie('token');
    await initAuthNav(token, { activeLink: 'place.html' });

    /* ── Get place ID from URL ──────────────────────────── */
    const params  = new URLSearchParams(window.location.search);
    const placeId = params.get('id');

    if (!placeId) window.location.replace('index.html');

    /* ── Fetch place details ────────────────────────────── */
    async function fetchPlace() {
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(
          `http://localhost:5000/api/v1/places/${encodeURIComponent(placeId)}`,
          { headers }
        );
        if (!res.ok) throw new Error(`Server error ${res.status}`);

        const place = await res.json();
        renderPlace(place);
        renderReviews(place.reviews ?? []);
        renderBooking(place);

      } catch (err) {
        console.error(err);
        document.getElementById('skeleton-place').remove();
        document.getElementById('place-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Could not load place</h3>
            <p>${escapeHTML(err.message)}</p>
            <a href="index.html" class="btn btn-outline" style="margin-top:16px;display:inline-block">← Back to Places</a>
          </div>`;
      }
    }

    /* ── Render place ───────────────────────────────────── */
    function renderPlace(place) {
      document.title = `${place.name} — HBnB`;
      document.getElementById('breadcrumb-name').textContent = place.name;

      const imgSrc    = place.image_url || place.thumbnail || 'images/place_default.jpg';
      const price     = Number(place.price_by_night ?? place.price ?? 0).toFixed(0);
      const hostName  = place.owner
        ? `${escapeHTML(place.owner.first_name ?? '')} ${escapeHTML(place.owner.last_name ?? '')}`.trim()
        : (place.host_name ? escapeHTML(place.host_name) : '—');
      const amenities = place.amenities ?? [];
      const loc       = [place.city, place.country].filter(Boolean).join(', ') || '—';

      const amenitiesHTML = amenities.length
        ? `<ul class="amenities-list">
            ${amenities.map(a => `<li>${escapeHTML(a.name ?? a)}</li>`).join('')}
           </ul>`
        : '<p style="color:var(--color-muted);font-size:.85rem">No amenities listed.</p>';

      const detailsEl = document.getElementById('skeleton-place');
      detailsEl.removeAttribute('aria-hidden');
      detailsEl.id = 'place-details-card';

      detailsEl.innerHTML = `
        <img class="place-details-hero"
             src="${escapeAttr(imgSrc)}"
             alt="${escapeAttr(place.name)}"
             onerror="this.src='images/place_default.jpg'" />
        <div class="place-info">
          <h1>${escapeHTML(place.name)}</h1>
          <div class="place-meta">
            <span class="place-meta-item">📍 ${escapeHTML(loc)}</span>
            <span class="place-meta-item">👤 Host: <strong>${hostName}</strong></span>
            <span class="place-meta-item">🏠 Max guests: <strong>${escapeHTML(String(place.max_guest ?? place.guests ?? '—'))}</strong></span>
            <span class="place-meta-item">🛏 Rooms: <strong>${escapeHTML(String(place.number_rooms ?? '—'))}</strong></span>
            <span class="place-meta-item">🚿 Bathrooms: <strong>${escapeHTML(String(place.number_bathrooms ?? '—'))}</strong></span>
          </div>
          <div class="place-price-badge">
            <span class="amount">$${escapeHTML(price)}</span>
            <span class="per">/ night</span>
          </div>
          <p class="place-description">
            ${escapeHTML(place.description || 'No description provided.')}
          </p>
          <h3 style="font-family:var(--font-display);font-size:1rem;margin-bottom:10px">Amenities</h3>
          ${amenitiesHTML}
        </div>`;

      if (token) {
        const ctaEl = document.getElementById('add-review-cta');
        ctaEl.style.display = 'block';
        ctaEl.innerHTML = `
          <a href="add_review.html?id=${encodeURIComponent(placeId)}" class="btn btn-primary">
            ✏️ Write a Review
          </a>`;
      }
    }

    /* ── Render reviews ─────────────────────────────────── */
    function renderReviews(reviews) {
      const section   = document.getElementById('reviews-section');
      const container = document.getElementById('reviews-container');
      section.style.display = 'block';

      if (reviews.length === 0) {
        container.innerHTML = '<p class="no-reviews">No reviews yet. Be the first to review this place!</p>';
        return;
      }

      reviews.forEach(r => {
        const card = document.createElement('article');
        card.className = 'review-card';

        const userName = r.user
          ? `${escapeHTML(r.user.first_name ?? '')} ${escapeHTML(r.user.last_name ?? '')}`.trim()
          : (r.user_name ? escapeHTML(r.user_name) : 'Anonymous');

        const date = r.created_at
          ? new Date(r.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
          : '';

        card.innerHTML = `
          <div class="review-card-header">
            <span class="review-author">${userName}</span>
            <span class="review-stars" title="${r.rating ?? 0} out of 5">${starsHTML(r.rating)}</span>
          </div>
          <p class="review-text">${escapeHTML(r.text ?? r.comment ?? '')}</p>
          ${date ? `<span class="review-date">${date}</span>` : ''}`;

        container.appendChild(card);
      });
    }

    /* ── Render booking ─────────────────────────────────── */
    function renderBooking(place) {
      const section = document.getElementById('booking-section');
      section.style.display = 'block';

      const price = Number(place.price_by_night ?? place.price ?? 0);

      section.innerHTML = `
        <div class="add-review" style="max-width:480px">
          <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:8px">Book this place</h2>
          <p style="color:var(--color-muted);font-size:.88rem;margin-bottom:24px">
            Select your dates to see the total price.
          </p>
          <div id="booking-error" class="form-error" role="alert"></div>
          <div class="form" id="booking-form">
            <div class="form-group">
              <label for="checkin">Check-in date</label>
              <input type="date" id="checkin" name="checkin" required />
            </div>
            <div class="form-group">
              <label for="checkout">Check-out date</label>
              <input type="date" id="checkout" name="checkout" required />
            </div>
            <div id="booking-summary" style="
              background:var(--color-tag-bg);
              border:1px solid var(--color-border);
              border-radius:8px;
              padding:14px 18px;
              display:none;
              font-size:.9rem;
            ">
              <p style="margin:0;color:var(--color-muted)">
                <strong id="booking-nights" style="color:var(--color-text)">—</strong> nights
                × <strong>$${price}</strong> / night
              </p>
              <p style="margin:6px 0 0;font-size:1.05rem;font-weight:700;color:var(--color-accent-dk)">
                Total: <span id="booking-total">$0</span>
              </p>
            </div>
            <div class="form-actions">
              ${token
                ? `<button id="confirm-booking" class="btn btn-primary">Confirm Booking</button>`
                : `<a href="login.html" class="btn btn-primary">Sign in to Book</a>`
              }
            </div>
          </div>
          <p id="booking-success" style="display:none;color:#27ae60;font-weight:600;margin-top:12px">
            🎉 Booking confirmed! Check your email for details.
          </p>
        </div>`;

      /* Date logic */
      const checkinEl  = document.getElementById('checkin');
      const checkoutEl = document.getElementById('checkout');
      const summary    = document.getElementById('booking-summary');
      const nightsEl   = document.getElementById('booking-nights');
      const totalEl    = document.getElementById('booking-total');

      /* Set min dates */
      const today = new Date().toISOString().split('T')[0];
      checkinEl.min = today;
      checkoutEl.min = today;

      function updateSummary() {
        const ci = new Date(checkinEl.value);
        const co = new Date(checkoutEl.value);
        if (!checkinEl.value || !checkoutEl.value || co <= ci) {
          summary.style.display = 'none';
          return;
        }
        const nights = Math.round((co - ci) / 864e5);
        nightsEl.textContent = nights;
        totalEl.textContent = `$${(nights * price).toFixed(0)}`;
        summary.style.display = 'block';
      }

      checkinEl.addEventListener('change', () => {
        /* checkout must be after checkin */
        checkoutEl.min = checkinEl.value;
        if (checkoutEl.value && checkoutEl.value <= checkinEl.value) {
          checkoutEl.value = '';
        }
        updateSummary();
      });
      checkoutEl.addEventListener('change', updateSummary);

      /* Confirm booking */
      const confirmBtn = document.getElementById('confirm-booking');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', async () => {
          const bookingErr = document.getElementById('booking-error');
          bookingErr.classList.remove('visible');

          if (!checkinEl.value || !checkoutEl.value) {
            bookingErr.textContent = 'Please select check-in and check-out dates.';
            bookingErr.classList.add('visible');
            return;
          }
          if (checkoutEl.value <= checkinEl.value) {
            bookingErr.textContent = 'Check-out must be after check-in.';
            bookingErr.classList.add('visible');
            return;
          }

          confirmBtn.textContent = 'Booking…';
          confirmBtn.disabled = true;

          try {
            const res = await fetch(
              `http://localhost:5000/api/v1/places/${encodeURIComponent(placeId)}/bookings`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                  check_in:  checkinEl.value,
                  check_out: checkoutEl.value
                })
              }
            );

            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              throw new Error(data.message || data.error || `Server error ${res.status}`);
            }

            /* Success */
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('booking-success').style.display = 'block';
            showToast('Booking confirmed!', 'success');

          } catch (err) {
            bookingErr.textContent = err.message;
            bookingErr.classList.add('visible');
            confirmBtn.textContent = 'Confirm Booking';
            confirmBtn.disabled = false;
          }
        });
      }
    }

    /* ── Init ───────────────────────────────────────────── */
    fetchPlace();
  </script>

</body>
</html>
